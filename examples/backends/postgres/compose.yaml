services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: dbmd
      POSTGRES_USER: dbmd
      POSTGRES_PASSWORD: dbmd-example
    ports:
      - "55432:5432"
    volumes:
      - ./schema/catalog:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbmd -d dbmd"]
      interval: 1s
      timeout: 5s
      retries: 60
