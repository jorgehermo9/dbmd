services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "58123:8123"
    volumes:
      - ./schema/analytics:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --query "SELECT count() FROM system.workloads WHERE name = 'analytics_interactive'"
          | grep --quiet '^1$'
      interval: 1s
      timeout: 5s
      retries: 120
