services:
  mysql:
    image: mysql:9.7.1
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: test
    ports:
      - "53306:3306"
    volumes:
      - ./schema/commerce:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --silent"]
      interval: 1s
      timeout: 5s
      retries: 120
