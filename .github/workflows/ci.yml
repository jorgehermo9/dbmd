name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: no
  NEXTEST_PROFILE: ci

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Restore Rust quality cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: quality
          cache-targets: true
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Install workflow validator
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin_dir="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$bin_dir"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$bin_dir" actionlint
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Check formatting
        run: just fmt-check
      - name: Validate workflow
        run: just workflow-lint
      - name: Run strict Clippy
        run: just lint

  tests:
    name: Tests / Local
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Restore Rust local-test cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-local
          cache-targets: true
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Install nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest@0.9.143
      - name: Unit tests
        run: just test-unit
      - name: Integration / Hermetic crates
        run: just test-integration-hermetic
      - name: Integration / Backend compatibility / SQLite
        run: just test-integration-backend sqlite
      - name: Integration / Backend compatibility / DuckDB
        run: just test-integration-backend duckdb
      - name: Integration / Application / Local
        run: just test-integration-application local
      - name: CLI end-to-end tests
        run: just test-e2e

  backend_integration:
    name: Tests / Integration / Backend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            name: PostgreSQL
          - backend: clickhouse
            name: ClickHouse
          - backend: mysql
            name: MySQL
          - backend: mariadb
            name: MariaDB
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Restore Rust backend-integration cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: integration-${{ matrix.backend }}
          cache-targets: true
          cache-on-failure: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Install nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: cargo-nextest@0.9.143
      - name: Backend compatibility integration
        run: just test-integration-backend ${{ matrix.backend }}
      - name: Application integration
        run: just test-integration-application ${{ matrix.backend }}

  ci:
    name: CI
    if: always()
    needs: [quality, tests, backend_integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI lane to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          BACKEND_INTEGRATION_RESULT: ${{ needs.backend_integration.result }}
        run: |
          [[ "$QUALITY_RESULT" == success ]]
          [[ "$TESTS_RESULT" == success ]]
          [[ "$BACKEND_INTEGRATION_RESULT" == success ]]
