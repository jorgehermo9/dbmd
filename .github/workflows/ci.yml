name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  INSTA_UPDATE: no

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  server-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: dbmd-backend-postgres
            feature: postgres-tests
            test: postgres
          - package: dbmd-backend-clickhouse
            feature: clickhouse-tests
            test: clickhouse
          - package: dbmd-backend-mysql
            feature: mysql-tests
            test: mysql
          - package: dbmd-backend-mariadb
            feature: mariadb-tests
            test: mariadb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ${{ matrix.package }} --features ${{ matrix.feature }} --test ${{ matrix.test }}
      - run: cargo test -p dbmd-app --features ${{ matrix.feature }} --test ${{ matrix.test }}
