[package]
name = "dbmd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
postgres-tests = ["dep:dbmd-test-support"]

[dependencies]
dbmd-core = { path = "../core" }
dbmd-introspect = { path = "../introspect" }
dbmd-render = { path = "../render" }
dbmd-test-support = { path = "../test-support", optional = true }
serde.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
insta.workspace = true
rusqlite.workspace = true

[[test]]
name = "postgres"
required-features = ["postgres-tests"]
