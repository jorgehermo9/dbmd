[package]
name = "dbmd-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
clickhouse-tests = ["dep:dbmd-test-support", "dbmd-test-support/clickhouse"]
mariadb-tests = ["dep:dbmd-test-support", "dbmd-test-support/mariadb"]
mysql-tests = ["dep:dbmd-test-support", "dbmd-test-support/mysql"]
postgres-tests = ["dep:dbmd-test-support", "dbmd-test-support/postgres"]

[dependencies]
dbmd-core = { path = "../core" }
dbmd-backends = { path = "../backends/composition" }
dbmd-render = { path = "../render" }
dbmd-test-support = { path = "../test-support", optional = true }
serde.workspace = true
similar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
dbmd-test-support = { path = "../test-support" }
duckdb.workspace = true
insta.workspace = true
rstest.workspace = true
rusqlite.workspace = true

[[test]]
name = "postgres"
required-features = ["postgres-tests"]

[[test]]
name = "clickhouse"
required-features = ["clickhouse-tests"]

[[test]]
name = "mysql"
required-features = ["mysql-tests"]

[[test]]
name = "mariadb"
required-features = ["mariadb-tests"]
