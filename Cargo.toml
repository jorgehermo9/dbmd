[workspace]
members = [
    "crates/app",
    "crates/backends/composition",
    "crates/backends/postgres",
    "crates/backends/relational",
    "crates/backends/sqlite",
    "crates/cli",
    "crates/core",
    "crates/render",
    "crates/test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jorgehermo9/dbmd"

[workspace.dependencies]
anyhow = "1.0.98"
bumpalo = "3.20.3"
clap = { version = "4.5.40", features = ["derive"] }
fallible-iterator = "0.3.0"
insta = { version = "1.48.0", features = ["yaml"] }
minijinja = { version = "2.10.2", features = ["loader"] }
postgres = "0.19.14"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
similar = "2.7.0"
sqlite3-parser = "0.17.0"
tempfile = "3.27.0"
testcontainers-modules = { version = "0.15.0", features = ["blocking", "postgres"] }
thiserror = "2.0.12"
toml = "0.9.8"
